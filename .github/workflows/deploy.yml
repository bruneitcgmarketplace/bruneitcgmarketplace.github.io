name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Test Home and product photo coverage
        run: node --test tools/home-*.test.mjs tools/set-photos.test.mjs
      - name: Refresh official news, release dates and Yuyutei cards
        run: node tools/refresh_home_feed.mjs
        env:
          HOME_FEED_PREVIOUS_URL: https://bruneitcgmarketplace.github.io/home-feed.json
      - name: Refresh Yuyutei card prices (keeps the committed catalogue if the source fails)
        run: node tools/refresh_catalog.mjs
        continue-on-error: true
        timeout-minutes: 8
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BANK_DETAILS: ${{ vars.VITE_BANK_DETAILS }}
          VITE_MEMBER_PRICE: ${{ vars.VITE_MEMBER_PRICE }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
